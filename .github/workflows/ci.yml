cd D:\Github\Test_GithubActions_Springboot; $p=".github\workflows\ci.yml"; $c=Get-Content $p -Raw; $c=$c -replace '(?ms)^  sca:\r?\n.*?(?=^  [A-Za-z0-9_-]+:\s*$|\z)', @'
  sca:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Cache Dependency Check database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ format('{0:yyyyMMdd}', github.event.repository.updated_at) }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          bash ./mvnw -B org.owasp:dependency-check-maven:check \
            -DskipTests \
            -DfailBuildOnCVSS=0 \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DnvdValidForHours=24 \
            -DdataDirectory=$HOME/.dependency-check-data \
            -DossIndexAnalyzerEnabled=false

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.xml
          if-no-files-found: warn

