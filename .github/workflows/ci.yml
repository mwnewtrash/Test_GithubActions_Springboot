name: CI

on:
  push:
    branches: ["main", "Devsecops-Pipeline"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build
        run: bash ./mvnw -B package -Dmaven.test.skip=true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - name: Build application
        run: bash ./mvnw -B package -Dmaven.test.skip=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  sca:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Restore Dependency Check database
        uses: actions/cache/restore@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B org.owasp:dependency-check-maven:check -DskipTests -DfailBuildOnCVSS=11 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DnvdValidForHours=24 -DdataDirectory=$HOME/.dependency-check-data -DossindexAnalyzerEnabled=false -Dformats=HTML,XML,JSON

      - name: Save Dependency Check database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      - name: Security Gate - Critical and High vulnerabilities
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys

          report = "target/dependency-check-report.json"

          with open(report, encoding="utf-8") as f:
              data = json.load(f)

          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}

          for dependency in data.get("dependencies", []):
              for vulnerability in dependency.get("vulnerabilities", []):
                  severity = vulnerability.get("severity", "").upper()
                  if severity in counts:
                      counts[severity] += 1

          total = sum(counts.values())

          print(f"Dependency-Check vulnerabilities evaluated: {total}")
          print(f"Critical findings: {counts['CRITICAL']}")
          print(f"High findings:     {counts['HIGH']}")
          print(f"Medium findings:   {counts['MEDIUM']}")
          print(f"Low findings:      {counts['LOW']}")

          if counts["CRITICAL"] > 0 or counts["HIGH"] > 0:
              print("SECURITY GATE: FAILED")
              print("Critical or High severity vulnerabilities detected.")
              sys.exit(1)

          print("SECURITY GATE: PASSED")
          PY
      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.xml
          if-no-files-found: warn
  secrets:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build application
        run: bash ./mvnw -B package -Dmaven.test.skip=true

      - name: Start application
        run: |
          nohup java -jar target/*.jar > /tmp/spring-boot.log 2>&1 &
          echo $! > /tmp/spring-boot.pid

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start."
          cat /tmp/spring-boot.log
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: http://127.0.0.1:8080
          fail_action: false
          allow_issue_writing: true
          issue_title: "DAST - OWASP ZAP Findings"

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/spring-boot.log

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/spring-boot.pid ]; then
            kill "$(cat /tmp/spring-boot.pid)" || true
          fi


  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build application
        run: bash ./mvnw -B package -Dmaven.test.skip=true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build container image
        run: docker build -t mwnewtrash/dockerhub_test_githubactions_springboot:${{ github.sha }} .

      - name: Verify container image
        run: docker image inspect mwnewtrash/dockerhub_test_githubactions_springboot:${{ github.sha }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mwnewtrash/dockerhub_test_githubactions_springboot:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Push container image
        id: push
        run: docker push mwnewtrash/dockerhub_test_githubactions_springboot:${{ github.sha }}

      - name: Get pushed image digest
        id: digest
        shell: bash
        run: |
          DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' mwnewtrash/dockerhub_test_githubactions_springboot:${{ github.sha }})"
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest container image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/mwnewtrash/dockerhub_test_githubactions_springboot
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  container-security:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build application
        run: bash ./mvnw -B package -Dmaven.test.skip=true

      - name: Build container image
        run: docker build -t test-githubactions-springboot:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: test-githubactions-springboot:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  iac-security:
    name: IaC Security - Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions
          quiet: false
          soft_fail: true

      - name: Scan Kubernetes manifests with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Generate CycloneDX SBOM
        run: |
          bash ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: warn

  provenance:
    name: Supply Chain - Build Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build application
        run: bash ./mvnw -B package -Dmaven.test.skip=true

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: target/*.jar

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/*.jar
          if-no-files-found: error

  terraform:
    name: Terraform - Validate and Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/floci/aws
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -input=false -refresh=false -out=tfplan
      - name: Terraform Security Scan - Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: false
          soft_fail: true
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/floci/aws/tfplan
          if-no-files-found: warn
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - build
      - dependency-review
      - codeql
      - sca
      - secrets
      - dast
      - container-build
      - container-security
      - iac-security
      - sbom
      - provenance
      - terraform
    if: always()
    permissions:
      contents: read

    steps:
      - name: Evaluate security controls
        shell: bash
        run: |
          echo "=========================================="
          echo "        DEVSECOPS SECURITY GATE"
          echo "=========================================="
          echo
          echo "Build:              ${{ needs.build.result }}"
          echo "Dependency Review:  ${{ needs.dependency-review.result }}"
          echo "CodeQL:             ${{ needs.codeql.result }}"
          echo "SCA:                ${{ needs.sca.result }}"
          echo "Gitleaks:           ${{ needs.secrets.result }}"
          echo "DAST:               ${{ needs.dast.result }}"
          echo "Container Build:    ${{ needs.container-build.result }}"
          echo "Container Security: ${{ needs.container-security.result }}"
          echo "IaC Security:       ${{ needs.iac-security.result }}"
          echo "SBOM:               ${{ needs.sbom.result }}"
          echo "Provenance:         ${{ needs.provenance.result }}"
          echo "Terraform:          ${{ needs.terraform.result }}"
          echo
          echo "=========================================="
          echo "            SECURITY POLICY"
          echo "=========================================="
          echo

          failed=0

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "BLOCK: Application build failed"
            failed=1
          fi

          if [ "${{ needs.dependency-review.result }}" != "success" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BLOCK: Dependency Review failed"
            failed=1
          fi

          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "BLOCK: CodeQL failed"
            failed=1
          fi

          if [ "${{ needs.secrets.result }}" != "success" ]; then
            echo "BLOCK: Secret scanning failed"
            failed=1
          fi

          if [ "${{ needs.sca.result }}" != "success" ]; then
            echo "BLOCK: SCA detected vulnerabilities above the configured policy threshold"
            failed=1
          fi

          if [ "${{ needs.container-build.result }}" != "success" ]; then
            echo "BLOCK: Container build failed"
            failed=1
          fi

          if [ "${{ needs.provenance.result }}" != "success" ]; then
            echo "BLOCK: Build provenance failed"
            failed=1
          fi

          if [ "${{ needs.terraform.result }}" != "success" ]; then
            echo "BLOCK: Terraform validation/security checks failed"
            failed=1
          fi
          echo "Kubernetes security scan: ${{ needs.iac-security.result }}"

          echo
          if [ "$failed" -ne 0 ]; then
            echo "=========================================="
            echo "SECURITY GATE: FAILED"
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "SECURITY GATE: PASSED"
          echo "=========================================="

  deploy-floci-eks:
    name: Deploy to Floci EKS (Test)
    runs-on: [self-hosted, Windows, X64]
    needs: container-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/Devsecops-Pipeline'
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Floci EKS access
        shell: powershell
        run: |
          kubectl --context floci-eks get nodes
          if ($LASTEXITCODE -ne 0) { throw 'Cannot access Floci EKS context.' }

      - name: Deploy published commit image
        shell: powershell
        run: |
          $image = "mwnewtrash/dockerhub_test_githubactions_springboot:${{ github.sha }}"
          $manifest = "k8s/deployment.yaml"
          $content = Get-Content $manifest -Raw
          $content = $content.Replace('image: vulnerable-springboot:local', "image: $image")
          $content = $content.Replace('imagePullPolicy: Never', 'imagePullPolicy: Always')
          Set-Content -Path $manifest -Value $content -Encoding utf8
          kubectl --context floci-eks apply -f $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Kubernetes apply failed.' }
          kubectl --context floci-eks rollout status deployment/vulnerable-springboot -n devsecops --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw 'Deployment rollout failed.' }
