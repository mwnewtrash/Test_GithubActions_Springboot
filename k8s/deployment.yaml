apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-springboot
  namespace: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-springboot
  template:
    metadata:
      labels:
        app: vulnerable-springboot
    spec:
      serviceAccountName: vulnerable-springboot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: vulnerable-springboot
          image: floci-ecr-registry:5000/devsecops/vulnerable-springboot:local
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-springboot
  namespace: devsecops
spec:
  selector:
    app: vulnerable-springboot
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
